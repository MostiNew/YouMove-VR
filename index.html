<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ROM Tracker – Voice & JSON</title>
<style>
:root {
  --bg:#0b1016; --card:#121820; --muted:#8aa0b2; --text:#eaf2f8; --accent:#50c878;
  --danger:#ff6b6b; --warn:#ffc857; --flash:#50c878;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
body{margin:0;background:linear-gradient(180deg,#0b1016,#0e141c);color:var(--text);}
.wrap{max-width:960px;margin:0 auto;padding:16px 14px 40px;}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:6px 0 14px;}
h1{font-size:22px;margin:0;}
.card{background:var(--card);border:1px solid #1d2732;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 24px rgba(0,0,0,.28);}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
select,input[type="text"],button,input[type="number"]{width:100%;padding:12px 12px;border-radius:12px;border:1px solid #203040;background:#0b1118;color:var(--text);font-size:15px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.btn{cursor:pointer;transition:transform .02s ease,opacity .2s;}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--accent);color:#072d19;border-color:#0d5b3a;font-weight:700;}
.btn.warn{background:var(--warn);color:#432; border-color:#a77;}
.btn.danger{background:var(--danger);color:#320a0a;border-color:#7a1e1e;}
.btn.ghost{background:#0a121a;border-color:#1d2a38;}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.tile{background:#0a121a;border:1px solid #1e2d3e;border-radius:16px;padding:14px;text-align:center;}
.tile h3{margin:4px 0 0;font-size:24px;}
.tile span{font-size:12px;color:var(--muted);}
.muted{color:var(--muted);}
table{width:100%;border-collapse:collapse;}
th,td{font-size:13px;border-bottom:1px solid #203040;padding:10px 8px;text-align:left;vertical-align:top;}
th{color:#a9bfd2;font-weight:600;}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#0e1822;border:1px solid #1e2d3e;font-size:12px;}
.hint{font-size:12px;color:var(--muted);margin-top:8px;}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.right{margin-left:auto;}
.small{font-size:12px;}
.separator{height:1px;background:#203040;margin:10px 0;border-radius:1px;}
button:focus{outline:3px solid rgba(80,200,120,0.18);outline-offset:2px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0f1b23;padding:10px 14px;border-radius:10px;border:1px solid #1f2f3a;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;z-index:999;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ROM Tracker – Voice & JSON</h1>
    <div class="flex">
      <span class="pill right" id="sensorStatus">Sensors: idle</span>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label>Joint</label>
        <select id="joint">
          <option>Shoulder</option>
          <option>Elbow</option>
          <option>Wrist</option>
          <option>Hip</option>
          <option>Knee</option>
          <option>Ankle</option>
          <option>Cervical Spine</option>
          <option>Lumbar Spine</option>
        </select>
      </div>
      <div>
        <label>Plane / Movement</label>
        <select id="plane">
          <option value="beta">Flexion/Extension (β)</option>
          <option value="gamma">Abduction/Adduction (γ)</option>
          <option value="alpha">Rotation (α)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="kpi">
      <div class="tile"><span>Angle (°)</span><h3 id="angle">—</h3></div>
      <div class="tile"><span>Max (°)</span><h3 id="max">—</h3></div>
      <div class="tile"><span>Min (°)</span><h3 id="min">—</h3></div>
      <div class="tile"><span>Zero Ref (°)</span><h3 id="zero">—</h3></div>
    </div>
  </div>

  <div class="card">
    <strong>Records</strong>
    <span class="small muted right" id="count">0 saved</span>
    <div class="separator"></div>
    <div style="overflow:auto">
      <table id="table">
        <thead>
          <tr><th>Time</th><th>Joint</th><th>Plane</th><th>Angle°</th><th>Min°</th><th>Max°</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="btn primary" id="downloadJSON">Download JSON</button>
    </div>
  </div>

  <p class="muted small">
    Disclaimer: For screening and documentation. Does not replace clinical judgment.<br>
    Contact: Moustafa Mohammed Elsayed Ali
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
const ui={
  angle:document.getElementById('angle'),
  min:document.getElementById('min'),
  max:document.getElementById('max'),
  zero:document.getElementById('zero'),
  joint:document.getElementById('joint'),
  plane:document.getElementById('plane'),
  tbody:document.getElementById('tbody'),
  count:document.getElementById('count'),
  toast:document.getElementById('toast'),
  sensorStatus:document.getElementById('sensorStatus'),
  downloadJSON:document.getElementById('downloadJSON')
};

let zero=0,minVal=Infinity,maxVal=-Infinity,currentAngle=0,running=false,listenerAdded=false;
let records=[],speechInterval=null;

// LocalStorage
function loadRecords(){try{return JSON.parse(localStorage.getItem('rom-records')||'[]');}catch{return[];}}
function saveRecords(){localStorage.setItem('rom-records',JSON.stringify(records));}
function fmtTime(ts){return new Date(ts).toLocaleTimeString();}
function showToast(txt,ms=1200){ui.toast.textContent=txt;ui.toast.style.display='block';clearTimeout(ui.toast._t);ui.toast._t=setTimeout(()=>ui.toast.style.display='none',ms);}

function refreshTable(){
  ui.tbody.innerHTML='';
  records.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${fmtTime(r.time)}</td><td>${r.joint}</td><td>${r.plane}</td><td>${r.angle.toFixed(1)}</td><td>${r.min.toFixed(1)}</td><td>${r.max.toFixed(1)}</td>`;
    ui.tbody.appendChild(tr);
  });
  ui.count.textContent=`${records.length} saved`;
}

// Sensors
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
async function enableSensors(){
  try{
    if(isIOS() && typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
      const res=await DeviceMotionEvent.requestPermission();
      if(res!=='granted')throw new Error('Permission denied');
    }
    if(!listenerAdded){window.addEventListener('deviceorientation',onOrient,true);listenerAdded=true;}
    ui.sensorStatus.textContent='Sensors: ready';
    showToast('Sensors enabled');
  }catch{ui.sensorStatus.textContent='Sensors blocked';showToast('Use Manual Mode');}
}
function getAxisAngle(a,b,g,plane){switch(plane){case'alpha':return((a+540)%360)-180;case'beta':return b;case'gamma':return g;}}

// Device orientation handler
function onOrient(e){
  if(!running)return;
  const a=Number.isFinite(e.alpha)?e.alpha:0;
  const b=Number.isFinite(e.beta)?e.beta:0;
  const g=Number.isFinite(e.gamma)?e.gamma:0;
  const raw=getAxisAngle(a,b,g,ui.plane.value)-zero;
  const wrapped=((raw+180)%360)-180;
  currentAngle=wrapped;
  if(currentAngle>maxVal)maxVal=currentAngle;
  if(currentAngle<minVal)minVal=currentAngle;
  ui.angle.textContent=currentAngle.toFixed(1);
  ui.max.textContent=maxVal.toFixed(1);
  ui.min.textContent=minVal.toFixed(1);
}

// Calibration
function setZero(){zero=currentAngle;minVal=Infinity;maxVal=-Infinity;ui.zero.textContent=zero.toFixed(1);ui.sensorStatus.textContent='Zero set';showToast('Zero calibrated');running=true;startSpeaking();}

// Start speaking every 10s
function startSpeaking(){
  if(speechInterval)clearInterval(speechInterval);
  speechInterval=setInterval(()=>{
    const msg=`Current angle is ${currentAngle.toFixed(1)} degrees`;
    const s=new SpeechSynthesisUtterance(msg);
    speechSynthesis.speak(s);
  },10000);
}

// Load saved records
records=loadRecords();
refreshTable();

// Add sensors automatically
enableSensors();

// Start measuring immediately after zero is set
running=false;

// Voice recognition (set zero only)
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  const recog=new SpeechRecognition();
  recog.continuous=true;
  recog.lang='en-US'; // default; can be 'de-DE','es-ES'
  recog.onresult=(e)=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const transcript=e.results[i][0].transcript.trim().toLowerCase();
      if(transcript.includes('set zero') || transcript.includes('nullpunkt') || transcript.includes('punto cero')){
        setZero();
      }
    }
  };
  recog.start();
}else{showToast('Voice commands not supported');}

// Save every 30s automatically
setInterval(()=>{
  if(running){
    records.unshift({time:Date.now(),joint:ui.joint.value,plane:ui.plane.options[ui.plane.selectedIndex].text,angle:currentAngle,min:minVal,max:maxVal});
    if(records.length>100)records.pop();
    saveRecords();
    refreshTable();
  }
},30000);

// Download JSON
ui.downloadJSON.addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='rom-tracker.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('JSON downloaded');
});
})();
</script>
</body>
</html>
