<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouMOVE VR</title>
<link rel="manifest" href="manifest.json">

<!-- Chart.js for live ROM graph -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:system-ui;background:#0b1016;color:#eaf2f8;margin:0;padding:20px}
.card{background:#121820;padding:16px;border-radius:14px;margin-bottom:12px}
button,select{padding:10px;border-radius:8px;border:none;margin:4px}
button{background:#50c878;color:#072d19;font-weight:bold;cursor:pointer}
.kpi{display:flex;gap:20px;font-size:22px}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #203040;padding:8px}
</style>
</head>
<body>

<h2>YouMOVE – ROM Tracker</h2>

<div class="card">
Joint
<select id="joint">
<option>Shoulder</option>
<option>Elbow</option>
<option>Wrist</option>
<option>Hip</option>
<option>Knee</option>
<option>Ankle</option>
<option>Cervical Spine</option>
<option>Lumbar Spine</option>
</select>

Plane
<select id="plane">
<option value="beta">Flexion/Extension</option>
<option value="gamma">Abduction</option>
<option value="alpha">Rotation</option>
</select>

Language
<select id="language">
<option value="en">English</option>
<option value="de">Deutsch</option>
<option value="es">Español</option>
</select>
</div>

<div class="card">
<div class="kpi">
<div>Angle <span id="angle">0.0</span>°</div>
<div>Min <span id="min">0.0</span></div>
<div>Max <span id="max">0.0</span></div>
</div>

<button id="enableBtn">Enable Sensors</button>
<button id="startBtn">Start</button>
<button id="stopBtn">Stop</button>
<button id="saveBtn">Save</button>
</div>

<div class="card">
<button id="pdfBtn">Generate PDF Report</button>
<button id="csvBtn">Export CSV</button>
</div>

<div class="card">
<h3>Session Records</h3>
<table>
<thead>
<tr>
<th>Time</th>
<th>Angle</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>

<div class="card">
<h3>Live ROM Graph</h3>
<canvas id="romChart" height="200"></canvas>
</div>

<script>
let running=false, zero=0, currentAngle=0, min=999, max=-999
let sessionData=[], captureInterval, speechInterval
const angleEl=document.getElementById("angle")
const minEl=document.getElementById("min")
const maxEl=document.getElementById("max")

// ===== Live Graph Setup =====
let chart, chartData=[]
function initChart(){
const ctx=document.getElementById("romChart")
chart=new Chart(ctx,{
type:"line",
data:{labels:[],datasets:[{label:"Angle",data:[],borderWidth:2,tension:0.3}]},
options:{animation:false,scales:{y:{min:-180,max:180}}}
})
}
function updateChart(angle){
if(!chart) return
chart.data.labels.push("")
chart.data.datasets[0].data.push(angle)
if(chart.data.labels.length>50){ chart.data.labels.shift(); chart.data.datasets[0].data.shift() }
chart.update()
}
initChart()
// ============================

// ===== Speech =====
function speakAngle(){
const lang=document.getElementById("language").value
let text=""
if(lang==="en") text=`Angle ${currentAngle.toFixed(1)} degrees`
if(lang==="de") text=`Winkel ${currentAngle.toFixed(1)} Grad`
if(lang==="es") text=`Ángulo ${currentAngle.toFixed(1)} grados`
speechSynthesis.speak(new SpeechSynthesisUtterance(text))
}
function startSpeech(){
speechInterval=setInterval(()=>{if(running) speakAngle()},10000)
}

// ===== Capture =====
function startCapture(){
sessionData=[]
captureInterval=setInterval(()=>{
sessionData.push({time:new Date().toLocaleTimeString(),angle:currentAngle})
render()
},500)
}
function stopCapture(){clearInterval(captureInterval)}
function render(){
const table=document.getElementById("records")
table.innerHTML=""
sessionData.forEach(r=>{
let row=document.createElement("tr")
row.innerHTML=`<td>${r.time}</td><td>${r.angle.toFixed(1)}</td>`
table.appendChild(row)
})
}

// ===== Sensor =====
document.getElementById("enableBtn").onclick=()=>{
if(typeof DeviceOrientationEvent!=='undefined'){
if(typeof DeviceOrientationEvent.requestPermission==='function'){
DeviceOrientationEvent.requestPermission().then(res=>{
if(res!=="granted"){alert("Sensors denied"); return}
addSensorListener()
}).catch(()=>alert("Sensors blocked"))
}else addSensorListener()
}else alert("DeviceOrientation not supported")
}
function addSensorListener(){
window.addEventListener("deviceorientation",e=>{
if(!running) return
let val=0
const plane=document.getElementById("plane").value
if(plane==="alpha") val=e.alpha||0
if(plane==="beta") val=e.beta||0
if(plane==="gamma") val=e.gamma||0
currentAngle=val-zero
if(currentAngle>max) max=currentAngle
if(currentAngle<min) min=currentAngle
angleEl.innerText=currentAngle.toFixed(1)
minEl.innerText=min.toFixed(1)
maxEl.innerText=max.toFixed(1)
updateChart(currentAngle)
})
}

// ===== Start/Stop =====
document.getElementById("startBtn").onclick=()=>{
running=true; startCapture(); startSpeech()
}
document.getElementById("stopBtn").onclick=()=>{
running=false; stopCapture(); clearInterval(speechInterval); analyzeMovement()
}

// ===== Movement Analysis =====
function analyzeMovement(){
if(sessionData.length<2){alert("No data"); return}
let diffs=[]
for(let i=1;i<sessionData.length;i++) diffs.push(Math.abs(sessionData[i].angle-sessionData[i-1].angle))
let avg=diffs.reduce((a,b)=>a+b,0)/diffs.length
let result=""
if(avg<2) result="Very smooth movement"
else if(avg<5) result="Normal movement"
else result="Irregular movement"
alert("Movement Quality: "+result)
}

// ===== PDF/CSV =====
document.getElementById("pdfBtn").onclick=()=>{
const {jsPDF}=window.jspdf
const doc=new jsPDF()
doc.text("YouMOVE Clinical Report",20,20)
doc.text("Joint: "+document.getElementById("joint").value,20,40)
doc.text("Max ROM: "+max.toFixed(1),20,50)
doc.text("Min ROM: "+min.toFixed(1),20,60)
doc.save("YouMOVE_Report.pdf")
}
document.getElementById("csvBtn").onclick=()=>{
let csv="time,angle\n"
sessionData.forEach(r=>csv+=`${r.time},${r.angle}\n`)
let blob=new Blob([csv]); let a=document.createElement("a")
a.href=URL.createObjectURL(blob); a.download="session.csv"; a.click()
}

// ===== Voice Zero Calibration =====
if('webkitSpeechRecognition' in window){
const rec=new webkitSpeechRecognition()
rec.continuous=true
rec.onresult=e=>{
let txt=e.results[e.results.length-1][0].transcript.toLowerCase()
if(txt.includes("set zero")){ zero=currentAngle; alert("Zero calibrated") }
}
rec.start()
}

// ===== Service Worker (PWA) =====
if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js')
</script>

</body>
</html>
