<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ROM Tracker – YouMOVE VR</title>
<style>
  :root { --bg:#0b1016; --card:#121820; --muted:#8aa0b2; --text:#eaf2f8; --accent:#50c878; --danger:#ff6b6b; --warn:#ffc857; --flash:#50c878; }
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  body{margin:0;background:linear-gradient(180deg,#0b1016,#0e141c);color:var(--text)}
  .wrap{max-width:960px;margin:0 auto;padding:16px 14px 40px}
  header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:6px 0 14px}
  h1{font-size:22px;margin:0}
  .card{background:var(--card);border:1px solid #1d2732;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 24px rgba(0,0,0,.28)}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  select, input[type="text"], button, input[type="number"]{width:100%;padding:12px 12px;border-radius:12px;border:1px solid #203040;background:#0b1118;color:var(--text);font-size:15px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{cursor:pointer;transition:transform .02s ease,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);color:#072d19;border-color:#0d5b3a;font-weight:700}
  .btn.ghost{background:#0a121a;border-color:#1d2a38}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .tile{background:#0a121a;border:1px solid #1d2a38;border-radius:16px;padding:14px;text-align:center}
  .tile h3{margin:4px 0 0;font-size:24px}
  .tile span{font-size:12px;color:var(--muted)}
  .muted{color:var(--muted)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0f1b23;padding:10px 14px;border-radius:10px;border:1px solid #1f2f3a;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;z-index:999}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>YouMOVE VR – Gelenkmessung</h1>
    <div class="row" style="width:220px">
      <button id="btnEnable" class="btn ghost">Enable Sensors</button>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label>Joint</label>
        <select id="joint">
          <option>Shoulder</option><option>Elbow</option><option>Wrist</option>
          <option>Hip</option><option>Knee</option><option>Ankle</option>
          <option>Cervical Spine</option><option>Lumbar Spine</option><option>Custom</option>
        </select>
      </div>
      <div>
        <label>Plane / Movement</label>
        <select id="plane">
          <option value="beta">Flexion/Extension (β / pitch)</option>
          <option value="gamma">Abduction/Adduction (γ / roll)</option>
          <option value="alpha">Rotation (α / yaw)</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div>
        <label>Side</label>
        <select id="side">
          <option>Right</option><option>Left</option><option>Midline</option>
        </select>
      </div>
      <div>
        <label>Notes</label>
        <input id="notes" type="text" placeholder="Optional notes">
      </div>
    </div>
    <div style="margin-top:10px;">
      <span>Angle: <span id="angle">—</span>°</span>
      <span style="margin-left:20px">Min: <span id="min">—</span>°</span>
      <span style="margin-left:20px">Max: <span id="max">—</span>°</span>
      <span style="margin-left:20px">Zero: <span id="zero">—</span>°</span>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const ui = {
    angle: document.getElementById('angle'),
    min: document.getElementById('min'),
    max: document.getElementById('max'),
    zero: document.getElementById('zero'),
    sensorStatus: document.getElementById('sensorStatus'),
    btnEnable: document.getElementById('btnEnable'),
    joint: document.getElementById('joint'),
    plane: document.getElementById('plane'),
    side: document.getElementById('side'),
    notes: document.getElementById('notes'),
    toast: document.getElementById('toast')
  };

  let running = true;
  let zero = 0, min = Infinity, max = -Infinity, currentAngle = 0, smoothedAngle = 0, listenerAdded = false, lastTs=0;

  // --- SENSOR ENABLE ---
  async function enableSensors(){
    try {
      if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
        const res = await DeviceMotionEvent.requestPermission();
        if(res!=='granted') throw new Error('Denied');
      }
      if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
        await DeviceOrientationEvent.requestPermission().catch(()=>{});
      }
      showToast('Sensors enabled');
      if(!listenerAdded){ window.addEventListener('deviceorientation', onOrient, true); listenerAdded=true; }
      startPeriodicReading();
      startVoiceCommands();
    } catch(e){ showToast('Sensors blocked'); }
  }
  ui.btnEnable.addEventListener('click', enableSensors);

  function getAxisAngle(a,b,g,p){switch(p){case 'alpha':return((a+540)%360)-180;case 'beta':return b;case 'gamma':return g;}}
  function onOrient(e){
    const now=performance.now();
    if(now-lastTs<40) return;
    lastTs=now;
    const a=Number.isFinite(e.alpha)?e.alpha:0;
    const b=Number.isFinite(e.beta)?e.beta:0;
    const g=Number.isFinite(e.gamma)?e.gamma:0;
    let raw=getAxisAngle(a,b,g,ui.plane.value)-zero;
    let wrapped=((raw+180)%360)-180;
    smoothedAngle+=0.18*(wrapped-smoothedAngle);
    currentAngle=smoothedAngle;
    if(currentAngle>max) max=currentAngle;
    if(currentAngle<min) min=currentAngle;
    ui.angle.textContent=currentAngle.toFixed(1);
    ui.min.textContent=min.toFixed(1);
    ui.max.textContent=max.toFixed(1);
  }

  // --- VOICE COMMAND ---
  function startVoiceCommands(){
    if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const r=new SR();
    r.continuous=true; r.lang='en-US'; r.interimResults=false;
    r.onresult=(e)=>{
      const t=e.results[e.results.length-1][0].transcript.toLowerCase();
      if(t.includes('set zero')){ zero=currentAngle; ui.zero.textContent=zero.toFixed(1); showToast('Zero set via voice'); }
    };
    r.onerror=console.log; r.start();
  }

  // --- PERIODIC READOUT ---
  function startPeriodicReading(){
    setInterval(()=>{
      if(running){
        const msg=new SpeechSynthesisUtterance(`Angle is ${currentAngle.toFixed(0)} degrees`);
        window.speechSynthesis.speak(msg);
      }
    },10000);
  }

  function showToast(txt,ms=1200){ ui.toast.textContent=txt; ui.toast.style.display='block'; clearTimeout(ui.toast._t); ui.toast._t=setTimeout(()=>ui.toast.style.display='none',ms);}
})();
</script>
</body>
</html>
