<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouMOVE VR – ROM Tracker</title>
<style>
body{font-family:system-ui;background:#0b1016;color:#eaf2f8;margin:0;padding:20px}
.card{background:#121820;padding:16px;border-radius:14px;margin-bottom:12px}
button,select{padding:10px;border-radius:8px;border:none;margin:4px}
button{background:#50c878;color:#072d19;font-weight:bold;cursor:pointer}
.kpi{display:flex;gap:20px;font-size:22px}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #203040;padding:8px}
</style>
</head>
<body>

<h2>YouMOVE – ROM Tracker</h2>

<div class="card">
Joint
<select id="joint">
<option>Shoulder</option>
<option>Elbow</option>
<option>Wrist</option>
<option>Hip</option>
<option>Knee</option>
<option>Ankle</option>
<option>Cervical Spine</option>
<option>Lumbar Spine</option>
</select>

Plane
<select id="plane">
<option value="beta">Flexion/Extension</option>
<option value="gamma">Abduction</option>
<option value="alpha">Rotation</option>
</select>

Language
<select id="language">
<option value="en">English</option>
<option value="de">Deutsch</option>
<option value="es">Español</option>
</select>
</div>

<div class="card">
<div class="kpi">
<div>Angle <span id="angle">0</span>°</div>
<div>Min <span id="min">0</span>°</div>
<div>Max <span id="max">0</span>°</div>
</div>

<button id="enableBtn">Enable Sensors</button>
<button id="zeroBtn">Set Zero</button>
<button id="voiceBtn">Enable Voice Commands</button>
<button id="startBtn">Start</button>
<button id="stopBtn">Stop</button>
<button id="saveBtn">Save</button>
</div>

<div class="card">
<button id="csvBtn">Export CSV</button>
</div>

<div class="card">
<h3>Session Records</h3>
<table>
<thead>
<tr>
<th>Time</th>
<th>Angle</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>

<script>
let running=false;
let zero=0;
let currentAngle=0;
let min=999;
let max=-999;
let sessionData=[];
let captureInterval;
let speechInterval;

const angleEl=document.getElementById("angle");
const minEl=document.getElementById("min");
const maxEl=document.getElementById("max");

function speakAngle(){
  const lang=document.getElementById("language").value;
  let text="";
  if(lang==="en") text=`Angle ${currentAngle.toFixed(1)} degrees`;
  if(lang==="de") text=`Winkel ${currentAngle.toFixed(1)} Grad`;
  if(lang==="es") text=`Ángulo ${currentAngle.toFixed(1)} grados`;
  const msg=new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(msg);
}

function startSpeech(){
  speechInterval=setInterval(()=>{
    if(running) speakAngle();
  },10000);
}

function startCapture(){
  sessionData=[];
  captureInterval=setInterval(()=>{
    sessionData.push({
      time:new Date().toLocaleTimeString(),
      angle:currentAngle
    });
    render();
  },5000);
}

function stopCapture(){
  clearInterval(captureInterval);
}

function render(){
  const table=document.getElementById("records");
  table.innerHTML="";
  sessionData.forEach(r=>{
    let row=document.createElement("tr");
    row.innerHTML=`<td>${r.time}</td><td>${r.angle.toFixed(1)}</td>`;
    table.appendChild(row);
  });
}

// Enable sensors
document.getElementById("enableBtn").onclick=()=>{
  if(typeof DeviceOrientationEvent!=="undefined"){
    window.addEventListener("deviceorientation", e=>{
      if(!running) return;
      let val=0;
      const plane=document.getElementById("plane").value;
      if(plane==="alpha") val=e.alpha||0;
      if(plane==="beta") val=e.beta||0;
      if(plane==="gamma") val=e.gamma||0;
      currentAngle=val-zero;
      if(currentAngle>max) max=currentAngle;
      if(currentAngle<min) min=currentAngle;
      angleEl.innerText=currentAngle.toFixed(1);
      minEl.innerText=min.toFixed(1);
      maxEl.innerText=max.toFixed(1);
    }, true);
    alert("✅ Sensors enabled! Place phone on distal segment.");
  } else {
    alert("Device orientation not supported.");
  }
};

// Manual zero calibration (works on all devices)
document.getElementById("zeroBtn").onclick=()=>{
  zero=currentAngle;
  min=currentAngle;
  max=currentAngle;
  angleEl.innerText=currentAngle.toFixed(1);
  minEl.innerText=min.toFixed(1);
  maxEl.innerText=max.toFixed(1);
  alert("✅ Zero calibrated manually!");
};

// Voice commands for "Set Zero" (Chrome/Android)
document.getElementById("voiceBtn").onclick=()=>{
  if('webkitSpeechRecognition' in window){
    const rec=new webkitSpeechRecognition();
    rec.continuous=true;
    rec.lang='en-US';
    rec.onresult=e=>{
      const txt=e.results[e.results.length-1][0].transcript.toLowerCase();
      if(txt.includes("set zero")){
        zero=currentAngle;
        min=currentAngle;
        max=currentAngle;
        angleEl.innerText=currentAngle.toFixed(1);
        minEl.innerText=min.toFixed(1);
        maxEl.innerText=max.toFixed(1);
        alert("✅ Zero calibrated via voice!");
      }
    };
    rec.start();
    alert("Voice commands enabled. Say 'Set Zero' now!");
  } else {
    alert("Speech recognition not supported on this device.");
  }
};

document.getElementById("startBtn").onclick=()=>{
  running=true;
  startCapture();
  startSpeech();
};

document.getElementById("stopBtn").onclick=()=>{
  running=false;
  stopCapture();
  clearInterval(speechInterval);
};

document.getElementById("saveBtn").onclick=()=>{
  alert(`Saved ${sessionData.length} records.`);
};

document.getElementById("csvBtn").onclick=()=>{
  let csv="time,angle\n";
  sessionData.forEach(r=>{ csv+=`${r.time},${r.angle}\n`; });
  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="session.csv";
  a.click();
};
</script>
</body>
</html>
