<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouMOVE VR – ROM Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:system-ui;background:#0b1016;color:#eaf2f8;margin:0;padding:16px}
.card{background:#121820;padding:16px;border-radius:14px;margin-bottom:12px}
button,select{padding:10px;border-radius:8px;border:none;margin:4px}
button{background:#50c878;color:#072d19;font-weight:bold;cursor:pointer}
.kpi{display:flex;gap:20px;font-size:22px}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #203040;padding:8px}
</style>
</head>
<body>

<h2>YouMOVE – ROM Tracker</h2>

<div class="card">
Joint
<select id="joint">
<option>Shoulder</option>
<option>Elbow</option>
<option>Wrist</option>
<option>Hip</option>
<option>Knee</option>
<option>Ankle</option>
<option>Cervical Spine</option>
<option>Lumbar Spine</option>
</select>

Plane
<select id="plane">
<option value="beta">Flexion/Extension</option>
<option value="gamma">Abduction/Adduction</option>
<option value="alpha">Rotation</option>
</select>

Language
<select id="language">
<option value="en">English</option>
<option value="de">Deutsch</option>
<option value="es">Español</option>
</select>
</div>

<div class="card">
<div class="kpi">
<div>Angle <span id="angle">0</span>°</div>
<div>Min <span id="min">0</span></div>
<div>Max <span id="max">0</span></div>
</div>

<button id="enableBtn">Enable Sensors</button>
<button id="voiceBtn">Start Voice Commands</button>
<button id="startBtn">Start Session</button>
<button id="stopBtn">Stop Session</button>
<button id="saveBtn">Save Record</button>
</div>

<div class="card">
<button id="pdfBtn">Generate PDF Report</button>
<button id="csvBtn">Export CSV</button>
</div>

<div class="card">
<h3>Session Records</h3>
<table>
<thead>
<tr>
<th>Time</th><th>Angle</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
let running=false, zero=0, currentAngle=0, min=999, max=-999;
let sessionData=[], captureInterval=null, speechInterval=null, recognition=null;
const angleEl=document.getElementById("angle");
const minEl=document.getElementById("min");
const maxEl=document.getElementById("max");

// Enable device orientation
document.getElementById("enableBtn").onclick = async ()=>{
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    try{
      const res = await DeviceOrientationEvent.requestPermission();
      if(res !== 'granted') { alert('Permission denied'); return; }
    }catch(e){ alert('Permission error'); return; }
  }
  alert("Sensors enabled. Place phone on moving segment.");
  window.addEventListener("deviceorientation", e=>{
    if(!running) return;
    let val=0, plane=document.getElementById("plane").value;
    if(plane==="alpha") val=e.alpha||0;
    if(plane==="beta") val=e.beta||0;
    if(plane==="gamma") val=e.gamma||0;
    currentAngle=val-zero;
    if(currentAngle>max) max=currentAngle;
    if(currentAngle<min) min=currentAngle;
    angleEl.innerText=currentAngle.toFixed(1);
    minEl.innerText=min.toFixed(1);
    maxEl.innerText=max.toFixed(1);
  });
};

// Voice recognition for "set zero"
document.getElementById("voiceBtn").onclick = ()=>{
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){ alert("Speech recognition not supported"); return; }
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRec();
  recognition.continuous=true;
  recognition.onresult=e=>{
    const txt = e.results[e.results.length-1][0].transcript.toLowerCase();
    if(txt.includes("set zero") || txt.includes("nullpunkt") || txt.includes("cero")){
      zero=currentAngle; alert("Zero calibrated!");
      min=currentAngle; max=currentAngle;
    }
  };
  recognition.start();
  alert("Voice command listening started (say 'set zero')");
};

// Session capture
function startCapture(){
  sessionData=[];
  captureInterval=setInterval(()=>{
    sessionData.push({time:new Date().toLocaleTimeString(), angle:currentAngle});
    renderTable();
  },5000); // 5 sec
  speechInterval=setInterval(()=>{ speakAngle(); },10000); // 10 sec
}

function stopCapture(){
  clearInterval(captureInterval); clearInterval(speechInterval);
}

function renderTable(){
  const table=document.getElementById("records"); table.innerHTML="";
  sessionData.forEach(r=>{
    const row=document.createElement("tr");
    row.innerHTML=`<td>${r.time}</td><td>${r.angle.toFixed(1)}</td>`;
    table.appendChild(row);
  });
}

function speakAngle(){
  const lang=document.getElementById("language").value;
  let text="";
  if(lang==="en") text=`Angle ${currentAngle.toFixed(1)} degrees`;
  if(lang==="de") text=`Winkel ${currentAngle.toFixed(1)} Grad`;
  if(lang==="es") text=`Ángulo ${currentAngle.toFixed(1)} grados`;
  const msg=new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(msg);
}

// Start / Stop session
document.getElementById("startBtn").onclick = ()=>{
  running=true;
  startCapture();
  alert("Session started");
};
document.getElementById("stopBtn").onclick = ()=>{
  running=false;
  stopCapture();
  analyzeMovement();
};

// Save single record
document.getElementById("saveBtn").onclick = ()=>{
  if(sessionData.length){
    localStorage.setItem("rom_session", JSON.stringify(sessionData));
    alert("Record saved locally");
  }
};

// PDF
document.getElementById("pdfBtn").onclick = ()=>{
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.text("YouMOVE Clinical Report",20,20);
  doc.text("Joint: "+document.getElementById("joint").value,20,40);
  doc.text("Max ROM: "+max.toFixed(1),20,50);
  doc.text("Min ROM: "+min.toFixed(1),20,60);
  doc.save("YouMOVE_Report.pdf");
};

// CSV
document.getElementById("csvBtn").onclick = ()=>{
  let csv="time,angle\n";
  sessionData.forEach(r=>{ csv+=`${r.time},${r.angle}\n`; });
  let blob=new Blob([csv]); let a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="session.csv"; a.click();
};

// Analyze movement
function analyzeMovement(){
  if(sessionData.length<2){ alert("Not enough data"); return; }
  let diffs=[];
  for(let i=1;i<sessionData.length;i++){
    diffs.push(Math.abs(sessionData[i].angle - sessionData[i-1].angle));
  }
  let avg=diffs.reduce((a,b)=>a+b,0)/diffs.length;
  let result="";
  if(avg<2) result="Very smooth movement";
  else if(avg<5) result="Normal movement";
  else result="Irregular movement";
  alert("Movement Quality: "+result);
}

// PWA support
if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js'); }
</script>
</body>
</html>
