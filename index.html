<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>YouMOVE AI</title>

<style>

body{
background:#0F172A;
color:#E2E8F0;
font-family:Arial;
display:flex;
justify-content:center;
}

.container{
max-width:420px;
width:100%;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.card{
background:#1E293B;
padding:20px;
margin:10px 0;
border-radius:16px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.angle{
font-size:64px;
font-weight:bold;
color:#22C55E;
}

button{
padding:12px;
margin:6px;
border:none;
border-radius:8px;
background:#22C55E;
color:#022c22;
font-weight:bold;
}

button:hover{
background:#16a34a;
}

.secondary{
background:#3B82F6;
color:white;
}

.warning{
background:#EF4444;
color:white;
}

table{
width:100%;
margin-top:10px;
}

td{
padding:6px;
border-bottom:1px solid #334155;
}

.small{
font-size:12px;
color:#94A3B8;
}

</style>

</head>

<body>

<div class="container">

<h1>YouMOVE AI</h1>

<div class="card">

<div class="angle" id="angle">0.0°</div>

<p>Min: <span id="min">0</span> | Max: <span id="max">0</span></p>

</div>

<div class="card">

<button onclick="enableSensors()">Enable Sensors</button>
<button onclick="enableVoice()">Enable Voice</button>

<button class="secondary" onclick="startSession()">Start</button>
<button class="warning" onclick="stopSession()">Stop</button>

<button onclick="setZero()">Set Zero</button>

</div>

<div class="card">

<h3>AI Feedback</h3>

<p id="ai">Waiting for session...</p>

</div>

<div class="card">

<h3>Session Data</h3>

<table id="table"></table>

</div>

<div class="card">

<button onclick="exportCSV()">Export CSV</button>

<button onclick="sendEmail()">Send Email</button>

<button onclick="sendWhatsApp()">Send WhatsApp</button>

</div>

<div class="card small">

This tool is for educational and physiotherapy tracking purposes only.  
It does not replace medical diagnosis or clinical assessment.

</div>

</div>

<script>

let running=false
let zero=0
let angle=0

let min=999
let max=-999

let data=[]
let interval

function enableSensors(){

if(!/Android/i.test(navigator.userAgent)){
alert("Android phone required")
return
}

window.addEventListener("deviceorientation",e=>{

if(!running) return

angle=(e.beta-zero)

document.getElementById("angle").innerText=angle.toFixed(1)+"°"

if(angle>max) max=angle
if(angle<min) min=angle

document.getElementById("max").innerText=max.toFixed(1)
document.getElementById("min").innerText=min.toFixed(1)

})

alert("Sensors enabled")

}

function startSession(){

running=true

interval=setInterval(()=>{

data.push(angle)

updateTable()

speak()

},5000)

}

function stopSession(){

running=false
clearInterval(interval)

analyzeAI()

}

function setZero(){

zero=angle
min=0
max=0

alert("Zero set")

}

function speak(){

let msg=new SpeechSynthesisUtterance("Angle "+angle.toFixed(1)+" degrees")

msg.lang="en-US"

speechSynthesis.cancel()
speechSynthesis.speak(msg)

}

function updateTable(){

let table=document.getElementById("table")

table.innerHTML=""

data.forEach((v,i)=>{

table.innerHTML+=`<tr><td>${i}</td><td>${v.toFixed(1)}</td></tr>`

})

}

function analyzeAI(){

if(data.length<3){
document.getElementById("ai").innerText="Not enough data"
return
}

let diff=[]

for(let i=1;i<data.length;i++){

diff.push(Math.abs(data[i]-data[i-1]))

}

let avg=diff.reduce((a,b)=>a+b)/diff.length

let result=""

if(avg<2) result="Excellent smooth movement"
else if(avg<5) result="Normal controlled movement"
else result="Irregular movement detected"

document.getElementById("ai").innerText=result

}

function exportCSV(){

let csv="angle\n"

data.forEach(v=>csv+=v+"\n")

let blob=new Blob([csv])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="youmove-session.csv"

a.click()

}

function sendEmail(){

let text=`YouMOVE Session

Max ROM: ${max.toFixed(1)}
Min ROM: ${min.toFixed(1)}

AI Result: ${document.getElementById("ai").innerText}`

window.location.href=`mailto:?subject=YouMOVE Report&body=${encodeURIComponent(text)}`

}

function sendWhatsApp(){

let text=`YouMOVE Session

Max ROM: ${max.toFixed(1)}
Min ROM: ${min.toFixed(1)}

AI Result: ${document.getElementById("ai").innerText}`

window.open(`https://wa.me/?text=${encodeURIComponent(text)}`)

}

function enableVoice(){

const Speech=window.SpeechRecognition||window.webkitSpeechRecognition

if(!Speech){
alert("Voice not supported")
return
}

let rec=new Speech()

rec.continuous=true

rec.onresult=e=>{

let txt=e.results[e.results.length-1][0].transcript.toLowerCase()

if(txt.includes("zero")) setZero()
if(txt.includes("start")) startSession()
if(txt.includes("stop")) stopSession()

}

rec.start()

alert("Voice commands enabled")

}

</script>

</body>
</html>
